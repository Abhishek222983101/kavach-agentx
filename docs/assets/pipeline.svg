<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img" aria-label="Kavach pipeline: the AI proposes, a separate verifier decides, only the payout service writes, with a signed one-time slip">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b97a5"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
<style>
text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8edf2}
.t{font-size:17px;font-weight:700}.s{font-size:12.5px;fill:#8b97a5}.k{font-size:11.5px;letter-spacing:2px;font-weight:600}
.flow{stroke:#34d399;stroke-width:2.4;fill:none;stroke-dasharray:7 6;animation:d 1.1s linear infinite}
@keyframes d{to{stroke-dashoffset:-26}}
</style></defs>
<rect width="1280" height="450" rx="18" fill="#0b1117"/>
<rect x="16" y="46" width="820" height="150" rx="16" fill="#f5a524" fill-opacity="0.05" stroke="#f5a524" stroke-opacity="0.4" stroke-dasharray="5 5"/>
<rect x="848" y="46" width="416" height="150" rx="16" fill="#34d399" fill-opacity="0.06" stroke="#34d399" stroke-opacity="0.4" stroke-dasharray="5 5"/>
<text class="k" x="32" y="34" style="fill:#f5a524">AI SIDE · CAN TALK, CAN ONLY PROPOSE</text>
<text class="k" x="864" y="34" style="fill:#34d399">DECIDES AND MOVES MONEY</text>
<rect x="28" y="64" width="168" height="114" rx="12" fill="#111a22" stroke="#2a3744" stroke-width="1.6"/>
<text class="t" x="44" y="94" style="fill:#e8edf2">Customer</text>
<text class="s" x="44" y="116">WhatsApp · Telegram</text>
<text class="s" x="44" y="134">Web chat · Hindi,</text>
<text class="s" x="44" y="152">Hinglish, English</text>
<rect x="236" y="64" width="168" height="114" rx="12" fill="#111a22" stroke="#f5a524" stroke-width="1.6"/>
<text class="t" x="252" y="94" style="fill:#e8edf2">Gateway</text>
<text class="s" x="252" y="116">one message format</text>
<text class="s" x="252" y="134">for every channel</text>
<rect x="444" y="64" width="168" height="114" rx="12" fill="#111a22" stroke="#f5a524" stroke-width="1.6"/>
<text class="t" x="460" y="94" style="fill:#e8edf2">Guard</text>
<text class="s" x="460" y="116">rules + trained model</text>
<text class="s" x="460" y="134">can only escalate</text>
<rect x="652" y="64" width="168" height="114" rx="12" fill="#111a22" stroke="#f5a524" stroke-width="1.6"/>
<text class="t" x="668" y="94" style="fill:#e8edf2">Agent</text>
<text class="s" x="668" y="116">LangGraph: reads</text>
<text class="s" x="668" y="134">records, makes a plan</text>
<rect x="860" y="64" width="168" height="114" rx="12" fill="#0f2a24" stroke="#34d399" stroke-width="1.6"/>
<text class="t" x="876" y="94" style="fill:#e8edf2">Verifier</text>
<text class="s" x="876" y="116">re-reads the records</text>
<text class="s" x="876" y="134">itself. Trusts nothing.</text>
<rect x="1068" y="64" width="168" height="114" rx="12" fill="#111a22" stroke="#34d399" stroke-width="1.6"/>
<text class="t" x="1084" y="94" style="fill:#e8edf2">Payout service</text>
<text class="s" x="1084" y="116">the only writer.</text>
<text class="s" x="1084" y="134">Needs a signed slip.</text>
<path d="M196 121H234" stroke="#8b97a5" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M404 121H442" stroke="#8b97a5" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M612 121H650" stroke="#8b97a5" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path class="flow" d="M820 121H858" marker-end="url(#g)"/>
<path class="flow" d="M1028 121H1066" marker-end="url(#g)"/>
<text class="k" x="32" y="232" style="fill:#8b97a5">WHAT THE VERIFIER DECIDES</text>
<rect x="652" y="244" width="172" height="92" rx="12" fill="#111a22" stroke="#f87171" stroke-width="1.6"/>
<text class="t" x="668" y="274" style="fill:#f87171">BLOCK</text>
<text class="s" x="668" y="296">customer told why,</text>
<text class="s" x="668" y="314">with the policy line</text>
<rect x="844" y="244" width="214" height="92" rx="12" fill="#111a22" stroke="#f5a524" stroke-width="1.6"/>
<text class="t" x="860" y="274" style="fill:#f5a524">ESCALATE</text>
<text class="s" x="860" y="296">seller: console, Telegram,</text>
<text class="s" x="860" y="314">email or phone call (press 1)</text>
<text class="s" x="860" y="332">approve = re-verified first</text>
<rect x="1078" y="244" width="158" height="92" rx="12" fill="#111a22" stroke="#60a5fa" stroke-width="1.6"/>
<text class="t" x="1094" y="274" style="fill:#60a5fa">Audit log</text>
<text class="s" x="1094" y="296">hash-chained,</text>
<text class="s" x="1094" y="314">append-only</text>
<rect x="444" y="244" width="188" height="92" rx="12" fill="#111a22" stroke="#f5a524" stroke-width="1.6"/>
<text class="t" x="460" y="274" style="fill:#e8edf2">Photo check</text>
<text class="s" x="460" y="296">vision model + our</text>
<text class="s" x="460" y="314">scoring, feeds Verifier</text>
<path d="M930 178L760 244" stroke="#8b97a5" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M951 178V242" stroke="#8b97a5" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M1152 178V242" stroke="#8b97a5" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="28" y="244" width="388" height="92" rx="12" fill="#0d1b2a" stroke="#60a5fa" stroke-width="1.6"/>
<text class="t" x="44" y="274" style="fill:#60a5fa">Postgres roles</text>
<text class="s" x="44" y="296">The AI's database user (kavach_reader) is refused</text>
<text class="s" x="44" y="314">INSERT / UPDATE on money tables: even a fully tricked</text>
<text class="s" x="44" y="332">AI has no way to move money.</text>
<text class="s" x="28" y="384">Dashed green = the only road to a payout. It passes the verifier and carries a signed, one-time slip.</text>
<text class="s" x="28" y="408">Change ₹500 to ₹5,000 after signing and the slip is refused. Every decision lands in the audit log.</text>
</svg>
