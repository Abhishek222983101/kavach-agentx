# Keeps the free Render backend awake (it sleeps after 15 idle minutes) until the judging window closes.
# A sleeping server would answer the first visitor slowly and would miss WhatsApp messages (they are polled).
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping until 17 Nov 2026
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261116 ]; then echo "judging over, nothing to do"; exit 0; fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://kavach-agentx-api.onrender.com/health) && [ "$code" = 200 ] && break
            sleep 20
          done
          echo "api: $code"
          curl -s -o /dev/null -w "web: %{http_code}\n" --max-time 30 https://kavach-agentx.vercel.app/
