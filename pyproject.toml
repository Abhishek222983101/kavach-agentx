[project]
name = "kavach-agentx"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
