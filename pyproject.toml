[project]
name = "kavach-agentx"
version = "0.1.0"
description = "Kavach: a support agent for small sellers that checks every refund against the records before it acts"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "honcho>=2.0.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "rank-bm25>=0.2.2",
    "twilio>=9.13.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["live: calls real external APIs (skipped unless KAVACH_LIVE=1)"]
